# Render 배포 정의(Blueprint).
# Render 대시보드에서 이 저장소를 연결하면 이 파일을 읽어 서비스를 만든다.
# DB는 Render가 아니라 Neon(Vercel 마켓플레이스)을 쓴다 — 웹과 같은 계정에서 관리하기 위함.
services:
  # 이름이 tongin-erp-api 인 이유: 같은 계정에 이 저장소와 무관한 예전 tongin-api 서비스가
  # 이미 있어서 충돌을 피했다.
  - type: web
    name: tongin-erp-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore # 무료 플랜에서 한국과 가장 가까운 리전
    plan: free # 15분 미사용 시 잠듦 — 실사용 전 starter($7/월)로 올릴 것
    healthCheckPath: /api/health
    envVars:
      # DATABASE_URL, ADMIN_PASSWORD 는 여기에 두지 않는다.
      # sync:false 로 선언하면 Blueprint 생성 화면에서 입력을 받는데, 그 값이
      # 저장되지 않는 경우가 있어 배포가 빈 값으로 떨어졌다.
      # 두 값은 대시보드 Environment 에서 직접 추가한다(가이드 참고).
      - key: JWT_SECRET
        generateValue: true # Render가 안전한 임의값을 생성
      - key: WEB_APP_URL
        value: https://tongin-erp.vercel.app
      - key: NODE_ENV
        value: production
