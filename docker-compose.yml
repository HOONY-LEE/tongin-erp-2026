services:
  postgres:
    image: postgres:16-alpine
    container_name: tongin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tongin
      POSTGRES_PASSWORD: tongin
      POSTGRES_DB: tongin
    ports:
      - "5433:5432"
    volumes:
      - tongin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tongin -d tongin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tongin-pgdata:
